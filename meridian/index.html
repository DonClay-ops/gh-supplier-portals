<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Partner Hub</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;background:#111827;color:#e5e7eb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:400px;background:#1f2937;border-radius:16px;padding:32px;border:1px solid #374151}
.brand{font-size:13px;letter-spacing:.2em;color:#a5b4fc;text-transform:uppercase}
h1{font-size:24px;margin:6px 0 20px;font-weight:500}
label{display:block;font-size:12px;color:#9ca3af;margin:14px 0 6px}
input{width:100%;padding:11px;border-radius:8px;border:1px solid #4b5563;background:#111827;color:#fff;font-size:15px}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-size:15px;cursor:pointer}
.err{color:#fca5a5;font-size:13px;margin-top:10px;min-height:18px}
.demo{font-size:11px;color:#9ca3af;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<div class="brand">Meridian Contract Interiors</div>
<h1>Partner Hub</h1>
<form id="f">
<label for="e">Email</label><input id="e" name="email" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit">Continue</button>
<div class="err" id="err"></div>
</form>
<div class="demo">Fictional demo site for a Copilot Studio showcase. Demo login: <b>procurement@gulfhorizon.example</b> / <b>Demo@2026</b></div>
</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){
e.preventDefault();
var u=document.getElementById('e').value.trim().toLowerCase(), p=document.getElementById('p').value;
if(u==='procurement@gulfhorizon.example' && p==='Demo@2026'){ try{sessionStorage.setItem('mr_auth','1')}catch(x){} location.href='hub.html'; }
else document.getElementById('err').textContent='We could not verify those details.';
});
</script>
</body>
</html>
